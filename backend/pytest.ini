[pytest]
# asyncio_mode = auto: every async def test_* function is run as an asyncio
# test without needing @pytest.mark.asyncio on each one.
asyncio_mode = auto

# Explicit fixture loop scope silences the pytest-asyncio 0.24 deprecation warning.
# "function" is correct here — each test gets a fresh event loop.
asyncio_default_fixture_loop_scope = function

# Only look for tests inside the tests/ directory.
testpaths = tests
